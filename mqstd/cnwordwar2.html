<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>汉字方块</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #f0f8ff, #e6f2ff);
            padding: 20px 15px;
            user-select: none;
            overflow-x: hidden;
            overflow-y: auto;
            font-family: "Microsoft YaHei", sans-serif;
        }
        .title {
            text-align: center;
            font-size: clamp(24px,5vw,36px);
            color: #2c3e50;
            margin-bottom: 24px;
            letter-spacing: 4px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.1);
        }
        table {
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
            border-collapse: separate;
            border-spacing: 12px;
        }
        td {
            text-align: center;
            vertical-align: middle;
            padding: 16px 8px;
            font-size: clamp(18px,4vw,24px);
            border-radius: 12px;
            background: #ffffff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            transition: all 0.25s ease;
            cursor: default;
        }
        td:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 18px rgba(0,0,0,0.12);
        }
        /* 等级标题行样式 */
        tr:first-child td {
            background: linear-gradient(135deg, #34495e, #2c3e50);
            color: #fff;
            font-weight: bold;
        }
        /* 分级配色 */
        tr td:nth-child(1) {
            background: linear-gradient(135deg,#fef6e4,#fff8e8);
            color:#a1582a;
        }
        tr td:nth-child(3) {
            background: linear-gradient(135deg,#e8f4fd,#dceffb);
            color:#286090;
        }
        tr td:nth-child(5) {
            background: linear-gradient(135deg,#fceef2,#fbdce4);
            color:#a23b57;
        }
        /* 中间分隔符 "-" */
        td:nth-child(2), td:nth-child(4) {
            background: transparent;
            box-shadow: none;
            font-weight:bold;
            color:#888;
            padding:0;
        }
        td:nth-child(2):hover, td:nth-child(4):hover {
            transform:none;
            box-shadow:none;
        }
    </style>
</head>
<body>
    <h1 class="title">汉字战争汉字卡片2</h1>
    <table>
        <tr>
            <td>一级</td><td>-</td><td>二级</td><td>-</td><td>三级</td>
        </tr>
        <tr>
            <td>兵</td><td>-</td><td>华雄</td><td>-</td><td>孙悟空</td>
        </tr>
        <tr>
            <td>卒</td><td>-</td><td>董卓</td><td>-</td><td>沙和尚</td>
        </tr>
        <tr>
            <td>盾</td><td>-</td><td>孟获</td><td>-</td><td>猪八戒</td>
        </tr>
        <tr>
            <td>伍</td><td>-</td><td>张角</td><td>-</td><td>唐三藏</td>
        </tr>
        <tr>
            <td>工</td><td>-</td><td>貂蝉</td><td>-</td><td>顺风耳</td>
        </tr>
        <tr>
            <td>仆</td><td>-</td><td>文丑</td><td>-</td><td>千里眼</td>
        </tr>
        <tr>
            <td>车</td><td>-</td><td>孙坚</td><td>-</td><td>神悟空</td>
        </tr>
        <tr>
            <td>马</td><td>-</td><td>二级</td><td>-</td><td>三级</td>
        </tr>
        <tr>
            <td>炮</td><td>-</td><td>二级</td><td>-</td><td>三级</td>
        </tr>
        <tr>
            <td>排</td><td>-</td><td>潘凤</td><td>-</td><td>黑无常</td>
        </tr>
        <tr>
            <td>营</td><td>-</td><td>颜良</td><td>-</td><td>白无常</td>
        </tr>
        <tr>
            <td>团</td><td>-</td><td>二级</td><td>-</td><td>三级</td>
        </tr>
    </table>
    
    <script>
        
    </script>
</body>
</html>
