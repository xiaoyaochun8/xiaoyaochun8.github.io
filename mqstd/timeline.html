<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日日程时间线</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, sans-serif;}
body{
  background:#eee;
  padding:20px;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}
.wrap{
  background:#fff;
  border:2px solid #aaa;
  border-radius:12px;
  padding:30px 16px 20px;
  box-shadow:0 4px 12px #0002;
  width:100%;
  max-width:100%;
}
.line-box{
  position:relative;
  width:100%;
  height:140px;
}

/* 时间线轨道 */
.track{
  position:absolute;
  left:0;
  right:0;
  top:46px;
  height:14px;
  background:#cccccc;
  border-radius:99px;
  z-index:1;
}

/* 已过去绿色进度 */
.progress{
  position:absolute;
  left:0;
  top:0;
  height:14px;
  width:0%;
  background:#42b960;
  border-radius:99px;
  z-index:2;
  transition:width 0.5s ease;
}

/* 站点容器 */
.station-group{
  position:absolute;
  left:0;
  right:0;
  top:0;
  bottom:0;
  display:flex;
  justify-content:space-between;
  z-index:5;
}
.station-item{
  flex:1;
  display:flex;
  justify-content:center;
  position:relative;
}

/* 圆点 */
.dot{
  position:absolute;
  top:53px;
  left:50%;
  transform:translate(-50%, -50%);
  width:18px;
  height:18px;
  border-radius:50%;
  background:#999;
  border:2px solid #fff;
  box-shadow:0 0 0 1px #888;
  z-index:6;
}
.dot.passed{
  background:#42b960;
  box-shadow:0 0 0 1px #42b960;
}
.dot.current{
  background:#39ff69;
  box-shadow:0 0 0 2px #222, 0 0 10px #39ff69;
}
.dot.future{
  background:#cccccc;
  box-shadow:0 0 0 1px #888;
}

/* 文字标签 */
.station-label{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  font-size:13px;
  text-align:center;
  white-space:nowrap;
  line-height:1.3;
}
.station-label.top{
  top:10px;
}
.station-label.bottom{
  top:72px;
}

/* ========== 火车轨道区域 ========== */
.lower-area{
  position:relative;
  margin-top:18px;
  width:100%;
  height:80px;
}

/* 淡色轨道 */
.train-track{
  position:absolute;
  left:0;
  right:0;
  top:50%;
  transform:translateY(-50%);
  height:20px;
  background:
    linear-gradient(#d5d5d5,#d5d5d5) 0 40%/100% 4px no-repeat,
    linear-gradient(#d5d5d5,#d5d5d5) 0 60%/100% 4px no-repeat,
    repeating-linear-gradient(90deg, #e2e2e2 0 14px, transparent 14px 22px);
  border-radius:4px;
  z-index:1;
}

/* 小火车：上移，初始从左边开始 */
.train-wrap{
  position:absolute;
  left:0%;
  top:50%;
  transform:translate(-50%, -90%);
  z-index:10;
  transition:left 2.4s cubic-bezier(0.4, 0, 0.2, 1);
  pointer-events:none;
}

.train{
  position:relative;
  width:54px;
  height:34px;
}

/* 烟囱 */
.chimney{
  position:absolute;
  left:6px;
  top:2px;
  width:10px;
  height:14px;
  background:#333;
  border-radius:2px 2px 0 0;
}
.chimney::before{
  content:"";
  position:absolute;
  left:-2px;
  top:-3px;
  width:14px;
  height:4px;
  background:#444;
  border-radius:2px;
}

/* 车身 */
.body{
  position:absolute;
  left:0;
  top:14px;
  width:44px;
  height:16px;
  background:#c0392b;
  border-radius:4px;
}
.body::before{
  content:"";
  position:absolute;
  left:6px;
  top:4px;
  width:8px;
  height:8px;
  background:#f1c40f;
  border-radius:2px;
}
.body::after{
  content:"";
  position:absolute;
  left:20px;
  top:4px;
  width:8px;
  height:8px;
  background:#f1c40f;
  border-radius:2px;
}

/* 车头 */
.front{
  position:absolute;
  left:40px;
  top:18px;
  width:14px;
  height:10px;
  background:#222;
  border-radius:3px 4px 4px 3px;
}

/* 车轮 */
.wheel{
  position:absolute;
  bottom:0;
  width:14px;
  height:14px;
  background:#222;
  border:3px solid #555;
  border-radius:50%;
}
.wheel.w1{left:4px;}
.wheel.w2{left:22px;}
.wheel.w3{left:38px;}

/* 烟雾 */
.smoke{
  position:absolute;
  left:11px;
  top:-18px;
  width:10px;
  height:10px;
  background:rgba(210,210,210,0.85);
  border-radius:50%;
  animation:smoke 1.6s infinite ease-out;
}
.smoke.s2{
  left:16px;
  top:-24px;
  animation-delay:0.4s;
}
.smoke.s3{
  left:22px;
  top:-30px;
  animation-delay:0.8s;
}

@keyframes smoke{
  0%{
    transform:translate(0,0) scale(0.6);
    opacity:0.9;
  }
  100%{
    transform:translate(-10px,-30px) scale(1.8);
    opacity:0;
  }
}
</style>
</head>
<body>

<div class="wrap">
  <div class="line-box">
    <div class="track">
      <div class="progress" id="progress"></div>
    </div>

    <div class="station-group">
      <div class="station-item" data-time="420">
        <div class="dot"></div>
        <div class="station-label top">起床<br>7点</div>
      </div>
      <div class="station-item" data-time="430">
        <div class="dot"></div>
        <div class="station-label bottom">早餐<br>7点10分</div>
      </div>
      <div class="station-item" data-time="460">
        <div class="dot"></div>
        <div class="station-label top">上学<br>7点40分</div>
      </div>
      <div class="station-item" data-time="720">
        <div class="dot"></div>
        <div class="station-label bottom">午餐<br>12点</div>
      </div>
      <div class="station-item" data-time="1050">
        <div class="dot"></div>
        <div class="station-label top">放学<br>5点半</div>
      </div>
      <div class="station-item" data-time="1140">
        <div class="dot"></div>
        <div class="station-label bottom">晚餐<br>7点</div>
      </div>
      <div class="station-item" data-time="1200">
        <div class="dot"></div>
        <div class="station-label top">写作业<br>8点</div>
      </div>
      <div class="station-item" data-time="1260">
        <div class="dot"></div>
        <div class="station-label bottom">睡觉<br>9点</div>
      </div>
    </div>
  </div>

  <div class="lower-area">
    <div class="train-track"></div>

    <div class="train-wrap" id="train">
      <div class="train">
        <div class="smoke"></div>
        <div class="smoke s2"></div>
        <div class="smoke s3"></div>
        <div class="chimney"></div>
        <div class="body"></div>
        <div class="front"></div>
        <div class="wheel w1"></div>
        <div class="wheel w2"></div>
        <div class="wheel w3"></div>
      </div>
    </div>
  </div>
</div>

<script>
const schedule = [
  {time: 420},
  {time: 430},
  {time: 460},
  {time: 720},
  {time: 1050},
  {time: 1140},
  {time: 1200},
  {time: 1260}
];
const totalCount = schedule.length;
const trainLag = 0.05; // 火车落后 5%

function getNowMinute(){
  const d = new Date();
  return d.getHours() * 60 + d.getMinutes();
}

function updateView(){
  const now = getNowMinute();
  let currentIndex = 0;

  for(let i = 0; i < schedule.length; i++){
    if(now >= schedule[i].time){
      currentIndex = i + 1;
    }
  }

  const percent = (currentIndex / (totalCount - 1)) * 100;
  document.getElementById('progress').style.width = percent + "%";
  const trainPercent = Math.max(0, percent - trainLag * 100);
  document.getElementById('train').style.left = trainPercent + "%";

  document.querySelectorAll('.station-item').forEach((item, idx)=>{
    const t = schedule[idx].time;
    const dot = item.querySelector('.dot');
    dot.className = "dot";

    if (t < now){
      dot.classList.add('passed');
    } else if (t === now){
      dot.classList.add('current');
    } else {
      dot.classList.add('future');
    }
  });
}

// 页面打开后，先让进度条和站点状态就位，再让火车从左边开过来
window.addEventListener('load', () => {
  updateView();

  const train = document.getElementById('train');
  // 先强制停在 0%
  train.style.transition = 'none';
  train.style.left = '0%';

  // 下一帧再开始行驶到当前位置
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      train.style.transition = 'left 2.4s cubic-bezier(0.4, 0, 0.2, 1)';
      updateView();
    });
  });
});

// 之后每 3 秒正常更新位置
setInterval(updateView, 3000);
</script>

</body>
</html>
