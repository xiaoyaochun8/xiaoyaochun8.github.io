<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 移动端视口关键配置 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>历史朝代图片查看器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent; /* 去除移动端点击高亮 */
        }
        body {
            font-family: "Microsoft Yahei", sans-serif;
            background-color: #222;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* 顶部缩略图列表 */
        .thumbnail-bar {
            height: 100px;
            background: #333;
            display: flex;
            gap: 8px;
            padding:8px;
            overflow-x: auto;
            flex-shrink: 0;
        }
        .thumbnail-bar::-webkit-scrollbar {
            height:4px;
        }
        .thumbnail-bar::-webkit-scrollbar-thumb {
            background:#666;
        }
        .thumb-item {
            height:100%;
            cursor: pointer;
            border:2px solid transparent;
            border-radius:4px;
            flex-shrink:0;
        }
        .thumb-item.active {
            border-color:#409eff;
        }
        .thumb-item img {
            height:100%;
            display:block;
        }
        /* 操作按钮区域，触屏加大按钮 */
        .control-bar {
            display:flex;
            justify-content:center;
            gap:8px;
            padding:10px;
            background:#2b2b2b;
            flex-shrink:0;
            flex-wrap: wrap;
        }
        button {
            padding:10px 14px;
            font-size:15px;
            cursor:pointer;
            border:none;
            border-radius:6px;
            background:#409eff;
            color:white;
            min-height:44px; /* 移动端最小触摸高度 */
        }
        button:active {
            background:#287bdb;
        }
        /* 图片容器，拖拽区域 */
        .viewer-wrap {
            flex:1;
            position:relative;
            overflow:hidden;
            background:#111;
        }
        .image-container {
            position:absolute;
            transform-origin: 0 0;
            cursor:grab;
            touch-action:none; /* 禁止浏览器默认触摸行为 */
        }
        .image-container.grabbing {
            cursor:grabbing;
        }
        .image-container img {
            display:block;
            pointer-events:none;
            max-width:none;
        }
    </style>
</head>
<body>
    <!-- 顶部缩略图 -->
    <div class="thumbnail-bar" id="thumbnailBar"></div>

    <!-- 切换、缩放按钮 -->
    <div class="control-bar">
        <button id="prevBtn">上一张</button>
        <button id="nextBtn">下一张</button>
        <button id="zoomInBtn">放大 +</button>
        <button id="zoomOutBtn">缩小 −</button>
        <button id="zoomResetBtn">重置视图</button>
    </div>

    <!-- 主查看区域 -->
    <div class="viewer-wrap">
        <div class="image-container" id="imgContainer">
            <img id="mainImg" src="" alt="朝代图片">
        </div>
    </div>

<script>
// ========== 配置图片列表，替换为你的历史朝代图片 ==========
const imageList = [
    {url:"https://picsum.photos/id/24/1200/800", title:"夏朝"},
    {url:"https://picsum.photos/id/42/1200/800", title:"商朝"},
    {url:"https://picsum.photos/id/65/1200/800", title:"周朝"},
    {url:"https://picsum.photos/id/90/1200/800", title:"秦朝"},
    {url:"https://picsum.photos/id/110/1200/800", title:"汉朝"},
    {url:"https://picsum.photos/id/133/1200/800", title:"唐朝"},
    {url:"https://picsum.photos/id/156/1200/800", title:"宋朝"},
    {url:"https://picsum.photos/id/178/1200/800", title:"明朝"},
    {url:"https://picsum.photos/id/199/1200/800", title:"清朝"},
];

let currentIndex = 0; // 默认索引0，第一张图片
let scale = 1;
let offsetX = 0;
let offsetY = 0;
let isDragging = false;
let lastX = 0;
let lastY = 0;
const scaleStep = 0.2;
const scaleMin = 0.2;
const scaleMax = 5;

// 触摸变量
let touchStartDistance = 0;
let touchStartScale = 1;
let touchStartX = 0;
let touchStartY = 0;

const thumbnailBar = document.getElementById('thumbnailBar');
const mainImg = document.getElementById('mainImg');
const imgContainer = document.getElementById('imgContainer');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const zoomInBtn = document.getElementById('zoomInBtn');
const zoomOutBtn = document.getElementById('zoomOutBtn');
const zoomResetBtn = document.getElementById('zoomResetBtn');

// 渲染顶部缩略图
function renderThumbnails(){
    thumbnailBar.innerHTML = '';
    imageList.forEach((item,idx)=>{
        const div = document.createElement('div');
        div.className = 'thumb-item';
        if(idx === currentIndex) div.classList.add('active');
        div.innerHTML = `<img src="${item.url}" alt="${item.title}">`;
        div.addEventListener('click',()=>{
            currentIndex = idx;
            resetTransform();
            render();
        })
        thumbnailBar.appendChild(div);
    })
}

// 重置缩放、偏移
function resetTransform(){
    scale = 1;
    offsetX = 0;
    offsetY = 0;
}

// 更新视图
function render(){
    const curr = imageList[currentIndex];
    mainImg.src = curr.url;
    document.querySelectorAll('.thumb-item').forEach((el,idx)=>{
        el.classList.toggle('active', idx === currentIndex);
    })
    updateTransform();
}

// 更新transform
function updateTransform(){
    imgContainer.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
}

// 上一张
prevBtn.addEventListener('click',()=>{
    currentIndex --;
    if(currentIndex < 0) currentIndex = imageList.length -1;
    resetTransform();
    render();
})

// 下一张
nextBtn.addEventListener('click',()=>{
    currentIndex ++;
    if(currentIndex >= imageList.length) currentIndex = 0;
    resetTransform();
    render();
})

// 按钮放大
zoomInBtn.addEventListener('click',()=>{
    scale += scaleStep;
    if(scale > scaleMax) scale = scaleMax;
    updateTransform();
})

// 按钮缩小
zoomOutBtn.addEventListener('click',()=>{
    scale -= scaleStep;
    if(scale < scaleMin) scale = scaleMin;
    updateTransform();
})

// 重置视图按钮
zoomResetBtn.addEventListener('click',()=>{
    resetTransform();
    render();
})

// ========== PC鼠标拖拽 ==========
imgContainer.addEventListener('mousedown',(e)=>{
    isDragging = true;
    imgContainer.classList.add('grabbing');
    lastX = e.clientX;
    lastY = e.clientY;
})

window.addEventListener('mousemove',(e)=>{
    if(!isDragging) return;
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    offsetX += dx;
    offsetY += dy;
    lastX = e.clientX;
    lastY = e.clientY;
    updateTransform();
})

window.addEventListener('mouseup',()=>{
    isDragging = false;
    imgContainer.classList.remove('grabbing');
})

// ========== 移动端触摸事件 ==========
// 计算双指距离
function getTouchDistance(touch1, touch2){
    const dx = touch2.clientX - touch1.clientX;
    const dy = touch2.clientY - touch1.clientY;
    return Math.sqrt(dx*dx + dy*dy);
}

imgContainer.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const touches = e.touches;
    if(touches.length === 1){
        // 单指拖拽
        isDragging = true;
        lastX = touches[0].clientX;
        lastY = touches[0].clientY;
    }else if(touches.length ===2){
        // 双指准备缩放
        isDragging = false;
        touchStartDistance = getTouchDistance(touches[0], touches[1]);
        touchStartScale = scale;
    }
})

imgContainer.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const touches = e.touches;
    if(touches.length === 1 && isDragging){
        const dx = touches[0].clientX - lastX;
        const dy = touches[0].clientY - lastY;
        offsetX += dx;
        offsetY += dy;
        lastX = touches[0].clientX;
        lastY = touches[0].clientY;
        updateTransform();
    }else if(touches.length ===2){
        const dist = getTouchDistance(touches[0], touches[1]);
        scale = touchStartScale * (dist / touchStartDistance);
        if(scale < scaleMin) scale = scaleMin;
        if(scale > scaleMax) scale = scaleMax;
        updateTransform();
    }
})

imgContainer.addEventListener('touchend', () => {
    isDragging = false;
})

imgContainer.addEventListener('touchcancel', () => {
    isDragging = false;
})

// 初始化：渲染缩略图 + 加载第一张图片
renderThumbnails();
render();
</script>
</body>
</html>
