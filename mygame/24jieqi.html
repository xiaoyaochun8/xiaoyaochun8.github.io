<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>二十四节气表盘｜自动匹配当日节气</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#fff8e8;
    font-family:"Microsoft Yahei",sans-serif;
}
.clock-wrap{
    position:relative;
    width:420px;
    height:420px;
    border-radius:50%;
    border:12px solid #ffb6c1;
    background:#ffe9ef;
}
.jieqi-item{
    position:absolute;
    width:60px;
    height:60px;
    left:50%;
    top:50%;
    text-align:center;
    font-size:15px;
    color:#6b3b54;
    font-weight:500;
    pointer-events:none;
}
.hand{
    position:absolute;
    left:50%;
    top:50%;
    transform-origin: center 0;
    border-radius:999px;
}
.hour-hand{
    width:8px;
    height:130px;
    background:#ff6b9c;
    margin-left:-4px;
    z-index:3;
}
.min-hand{
    width:5px;
    height:180px;
    background:#62b6ff;
    margin-left:-2.5px;
    z-index:2;
}
.center-dot{
    position:absolute;
    left:50%;
    top:50%;
    width:22px;
    height:22px;
    background:#ff85a8;
    border-radius:50%;
    transform:translate(-50%,-50%);
    z-index:10;
}
.tip-text{
    position:absolute;
    bottom:-50px;
    width:100%;
    text-align:center;
    font-size:16px;
    color:#91526e;
}
</style>
</head>
<body>
<div class="clock-wrap">
    <div class="clock-face" id="clockFace"></div>
    <div class="hand hour-hand" id="hourHand"></div>
    <div class="hand min-hand" id="minHand"></div>
    <div class="center-dot"></div>
    <div class="tip-text" id="infoText"></div>
</div>

<script>
const jieqiList = [
    "立春","雨水","惊蛰","春分","清明","谷雨",
    "立夏","小满","芒种","夏至","小暑","大暑",
    "立秋","处暑","白露","秋分","寒露","霜降",
    "立冬","小雪","大雪","冬至","小寒","大寒"
];

// 2026–2027节气起止日期
const jieqiDateRanges = [
    {start:"2026-02-04",end:"2026-02-18"}, // 0立春
    {start:"2026-02-19",end:"2026-03-04"}, // 1雨水
    {start:"2026-03-05",end:"2026-03-19"}, // 2惊蛰
    {start:"2026-03-20",end:"2026-04-04"}, // 3春分
    {start:"2026-04-05",end:"2026-04-19"}, // 4清明
    {start:"2026-04-20",end:"2026-05-04"}, // 5谷雨
    {start:"2026-05-05",end:"2026-05-20"}, // 6立夏
    {start:"2026-05-21",end:"2026-06-04"}, // 7小满
    {start:"2026-06-05",end:"2026-06-20"}, // 8芒种
    {start:"2026-06-21",end:"2026-07-06"}, // 9夏至
    {start:"2026-07-07",end:"2026-07-21"}, //10小暑
    {start:"2026-07-22",end:"2026-08-06"}, //11大暑
    {start:"2026-08-07",end:"2026-08-22"}, //12立秋
    {start:"2026-08-23",end:"2026-09-07"}, //13处暑
    {start:"2026-09-08",end:"2026-09-22"}, //14白露
    {start:"2026-09-23",end:"2026-10-07"}, //15秋分
    {start:"2026-10-08",end:"2026-10-23"}, //16寒露
    {start:"2026-10-24",end:"2026-11-07"}, //17霜降
    {start:"2026-11-08",end:"2026-11-21"}, //18立冬
    {start:"2026-11-22",end:"2026-12-06"}, //19小雪
    {start:"2026-12-07",end:"2026-12-21"}, //20大雪
    {start:"2026-12-22",end:"2027-01-05"}, //21冬至
    {start:"2027-01-06",end:"2027-01-19"}, //22小寒
    {start:"2027-01-20",end:"2027-02-03"}  //23大寒
];

const STEP = 15;
const RADIUS = 186;
const BASE_TEXT = -90;
const OFFSET_Y = 20;

const clockFace = document.getElementById("clockFace");
const hourHand = document.getElementById("hourHand");
const minHand = document.getElementById("minHand");
const infoText = document.getElementById("infoText");

// 绘制节气文字环
function drawDial(){
    for(let i=0;i<24;i++){
        const angle = BASE_TEXT + i * STEP;
        const rad = angle * Math.PI / 180;
        const x = RADIUS * Math.cos(rad);
        const y = RADIUS * Math.sin(rad) + OFFSET_Y;
        const div = document.createElement("div");
        div.className = "jieqi-item";
        div.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
        div.textContent = jieqiList[i];
        clockFace.appendChild(div);
    }
}

// 获取今日对应的节气下标
function getCurrentJieqiIndex(){
    const today = new Date();
    for(let i=0;i<jieqiDateRanges.length;i++){
        const r = jieqiDateRanges[i];
        const s = new Date(r.start);
        const e = new Date(r.end + " 23:59:59");
        if(today >= s && today <= e) return i;
    }
    return 0; // 兜底立春
}

drawDial();

// 时针固定立春
hourHand.style.transform = `rotate(180deg)`;

// 分针自动指向当日节气
const idx = getCurrentJieqiIndex();
const mAngle = 180 + idx * STEP;
minHand.style.transform = `rotate(${mAngle}deg)`;

infoText.textContent = `时针：立春｜分针：${jieqiList[idx]}`;
</script>
</body>
</html>
<!-- 
用html生成一个表盘时钟类型的工具，实现以下功能：
1. 使用圆形表盘时钟显示界面
2. 表盘上不显示12小时，改为显示24节气
3. 保留时针、分针，时针指向当前节气
4. 页面配色风格卡通可爱
-->
