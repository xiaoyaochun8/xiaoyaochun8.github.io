<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
        <title>TviewTree</title>
    </head>
    <body>
        <div class="box outBox">
            <span class="title titleB">Server</span>
            <div class="box">
                <span class="title titleB">html</span>
                <div class="box">
                    <span class="title titleB">github pages</span>
                </div>
                <div class="box">
                    <span class="title titleB">gitee pages</span>
                </div>
            </div>
            <div class="box">
                <span class="title titleB">html+php</span>
                <div class="box">
                    <span class="title titleB">pi</span>
                </div>
                <div class="box">
                    <span class="title titleB">router</span>
                </div>
            </div>
            <div class="box">
                <span class="title titleB">html+php+mysql</span>
                <div class="box">
                    <span class="title titleB">阿里云</span>
                </div>
                <div class="box">
                    <span class="title titleB">免费1</span>
                </div>
            </div>
        </div>

        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <script>
            $('.title').on('click', function(evt){
                var obj = $(evt.currentTarget);
                if(obj.hasClass('titleA')){
                    obj.removeClass('titleA');
                    obj.addClass('titleB');
                    obj.parent().find('div').show();
                }else{
                    obj.addClass('titleA');
                    obj.removeClass('titleB');
                    obj.parent().find('div').hide();
                }
            });
        </script>

        <style>
            .box{
                margin-left: 30px;
                margin-top: 5px;
            }
            .outBox{
                margin-left: 0px;
                margin-top: 5px;
            }
            .box .title{
                border: solid 1px red;
                background: lightblue;
            }
            .box .titleA:before{
                content: "+ ";
                background: white;
            }
            .box .titleB:before{
                content: "- ";
                background: white;
            }
        </style>
    </body>
</html>
